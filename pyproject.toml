[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lindas-growth-agent"
version = "0.1.0"
description = "Autonomous ecommerce growth agent for lindas.com (Linda's Electric Quilters, Shopify Plus)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
  "httpx>=0.27",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
lindas-agent = "lindas_agent.cli:main"

[tool.setuptools.packages.find]
include = ["lindas_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"
